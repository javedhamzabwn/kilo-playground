<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilo AI Playground</title>
<style>
  * { box-sizing: border-box; }
  :root { --bg: #0f1115; --panel: #171a21; --line: #2a2e3a; --txt: #e8eaf0; --dim: #9aa3b2; --acc: #3b82f6; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--txt); margin: 0; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 6px 0 0; font-weight: 650; white-space: nowrap; }
  header input, header select { font-size: 13px; border-radius: 8px; border: 1px solid var(--line); background: #1e222c; color: var(--txt); padding: 7px 9px; }
  #baseUrl { flex: 1; min-width: 200px; }
  #apiKey { width: 130px; }
  #modelSel { max-width: 220px; }
  button { font-size: 13px; border-radius: 8px; border: none; background: var(--acc); color: #fff; padding: 8px 14px; cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: #1e222c; border: 1px solid var(--line); }
  #status { font-size: 12px; color: var(--dim); width: 100%; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 900px; width: 100%; margin: 0 auto; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.55; font-size: 14px; }
  .user { align-self: flex-end; background: #2563eb; }
  .bot { align-self: flex-start; background: #1e222c; border: 1px solid var(--line); }
  .err { align-self: flex-start; background: #3a1d1d; border: 1px solid #7f2d2d; }
  .meta { font-size: 11px; color: var(--dim); margin-top: 6px; }
  .typing { color: var(--dim); font-style: italic; }
  #composer { display: flex; gap: 8px; padding: 12px 14px; background: var(--panel); border-top: 1px solid var(--line); }
  #composerWrap { display: flex; gap: 8px; max-width: 900px; width: 100%; margin: 0 auto; }
  #composer textarea { flex: 1; resize: none; min-height: 44px; max-height: 150px; font-size: 14px; border-radius: 10px; border: 1px solid var(--line); background: #1e222c; color: var(--txt); padding: 10px 12px; font-family: inherit; }
  #sysRow { display: flex; gap: 8px; padding: 8px 14px 0; background: var(--panel); }
  #sysRow input { flex: 1; max-width: 900px; margin: 0 auto; width: 100%; font-size: 12px; border-radius: 8px; border: 1px solid var(--line); background: #1e222c; color: var(--txt); padding: 7px 10px; }
  .hint { font-size: 11px; color: var(--dim); padding: 6px 14px 0; background: var(--panel); text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Kilo AI Playground</h1>
  <input id="baseUrl" placeholder="API base URL, e.g. https://xxx.loca.lt">
  <input id="apiKey" placeholder="API key (any value works)">
  <select id="modelSel"><option value="">loading models...</option></select>
  <button id="reload" class="ghost" title="Reload model list">Reload</button>
  <button id="clear" class="ghost" title="Clear chat">Clear</button>
  <span id="status"></span>
</header>
<div id="sysRow"><input id="sysPrompt" placeholder="System prompt (optional), e.g. You are a helpful assistant."></div>
<div class="hint">If the tunnel URL changes, paste the new one above and hit Reload. Any API key value works.</div>
<div id="chat"></div>
<div id="composer"><div id="composerWrap">
  <textarea id="input" placeholder="Type a message, Enter to send (Shift+Enter for new line)..."></textarea>
  <button id="send">Send</button>
</div></div>
<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), input = $('input'), sendBtn = $('send');
const baseUrlEl = $('baseUrl'), apiKeyEl = $('apiKey'), modelSel = $('modelSel');
const sysEl = $('sysPrompt'), statusEl = $('status');
const history = [];

const LS = { get: (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
             set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

baseUrlEl.value = LS.get('kilo_base', 'https://kilo-api-alhussainacademy.loca.lt');
apiKeyEl.value = LS.get('kilo_key', 'playground');
sysEl.value = LS.get('kilo_sys', '');

function base() { return baseUrlEl.value.replace(/\/+$/, ''); }
function headers() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (apiKeyEl.value || 'x') }; }

function addMsg(cls, text, meta) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; d.appendChild(m); }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function loadModels() {
  modelSel.innerHTML = '<option value="">loading models...</option>';
  statusEl.textContent = 'connecting...';
  try {
    const r = await fetch(base() + '/v1/models', { headers: headers() });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const models = (j.data || []).map(m => ({ id: m.id, label: m.display_name || m.id })).sort((a, b) => a.id.localeCompare(b.id));
    modelSel.innerHTML = '';
    if (!models.length) throw new Error('no models returned');
    models.forEach(m => { const o = document.createElement('option'); o.value = m.id; o.textContent = m.label; modelSel.appendChild(o); });
    const saved = LS.get('kilo_model', '');
    const pref = [saved, 'deepseek-v3', 'deepseek-3-2', 'gpt-5-3-codex'].filter(Boolean);
    for (const p of pref) { const o = [...modelSel.options].find(x => x.value === p); if (o) { modelSel.value = p; break; } }
    statusEl.textContent = 'connected: ' + models.length + ' models available';
    LS.set('kilo_base', baseUrlEl.value); LS.set('kilo_key', apiKeyEl.value);
  } catch (e) {
    modelSel.innerHTML = '<option value="">failed to load</option>';
    statusEl.textContent = 'connection failed: ' + e.message + ' (is the tunnel URL correct and online?)';
  }
}

async function send() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  if (!modelSel.value) { addMsg('err', 'No model selected. Check the API URL and hit Reload.'); return; }
  input.value = '';
  addMsg('user', text);
  const sys = sysEl.value.trim();
  const msgs = [];
  if (sys) msgs.push({ role: 'system', content: sys });
  msgs.push(...history, { role: 'user', content: text });
  sendBtn.disabled = true;
  const t = addMsg('bot', 'thinking...'); t.classList.add('typing');
  const t0 = Date.now();
  try {
    const r = await fetch(base() + '/v1/chat/completions', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ model: modelSel.value, messages: msgs, temperature: 0.7, max_tokens: 2048 })
    });
    const j = await r.json().catch(() => ({}));
    t.classList.remove('typing');
    if (!r.ok) { t.className = 'msg err'; t.textContent = 'Error HTTP ' + r.status + ': ' + (j.error ? JSON.stringify(j.error).slice(0, 300) : r.statusText); }
    else {
      const reply = (((j.choices || [])[0] || {}).message || {}).content || '(empty reply)';
      const secs = ((Date.now() - t0) / 1000).toFixed(1);
      const toks = j.usage && j.usage.total_tokens ? ' | ' + j.usage.total_tokens + ' tokens' : '';
      t.textContent = reply;
      const m = document.createElement('div'); m.className = 'meta';
      m.textContent = (j.model || modelSel.value) + ' | ' + secs + 's' + toks;
      t.appendChild(m);
      history.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
    }
  } catch (e) { t.classList.remove('typing'); t.className = 'msg err'; t.textContent = 'Request failed: ' + e.message; }
  sendBtn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

sendBtn.onclick = send;
$('reload').onclick = loadModels;
$('clear').onclick = () => { chat.innerHTML = ''; history.length = 0; };
modelSel.onchange = () => LS.set('kilo_model', modelSel.value);
sysEl.onchange = () => LS.set('kilo_sys', sysEl.value);
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
baseUrlEl.addEventListener('change', loadModels);
loadModels();
</script>
</body>
</html>
