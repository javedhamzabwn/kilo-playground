<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kilo AI Playground</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root, [data-theme="light"] {
    --bg: #f7f5ef; --sidebar: #efece2; --card: #ffffff; --input: #ffffff;
    --text: #2c2721; --muted: #8b8474; --faint: #b9b2a1;
    --accent: #c15f3c; --accent-soft: rgba(193,95,60,.12);
    --border: #e2dccb; --bubble-ai: #ffffff; --bubble-user: #e9e4d6;
    --shadow: 0 8px 30px rgba(60,50,30,.12); --radius: 14px;
  }
  [data-theme="dark"] {
    --bg: #191712; --sidebar: #12100c; --card: #211e17; --input: #262219;
    --text: #ece6d8; --muted: #a09a86; --faint: #6b6552;
    --accent: #d97757; --accent-soft: rgba(217,119,87,.14);
    --border: #332e22; --bubble-ai: #262219;
    --bubble-user: #37331f; --shadow: 0 8px 30px rgba(0,0,0,.4); --radius: 14px;
  }
  html, body { height: 100%; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden; }
  button { font-family: inherit; }

  .app { display: flex; height: 100dvh; }

  /* ---------- sidebar ---------- */
  .sidebar { width: 300px; flex: none; background: var(--sidebar); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 40; }
  .side-head { padding: 14px 14px 8px; display: flex; gap: 8px; align-items: center; }
  .newchat { flex: 1; border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; }
  .newchat:active { transform: scale(.98); }
  .iconbtn { width: 42px; height: 42px; flex: none; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 17px; cursor: pointer; }
  .searchrow { padding: 4px 14px 8px; }
  .searchrow input { width: 100%; border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 9px 12px; font-size: 13px; }
  .side-scroll { flex: 1; overflow-y: auto; padding: 2px 8px 12px; }
  .sechead { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 8px 6px; font-size: 11px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--muted); }
  .sechead button { border: none; background: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 2px 6px; }
  .folder { border-radius: 10px; margin-bottom: 2px; }
  .folder-head { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px;
    cursor: pointer; font-size: 13.5px; font-weight: 600; }
  .folder-head:hover { background: var(--accent-soft); }
  .folder-head .caret { color: var(--faint); font-size: 11px; width: 14px; }
  .folder-head .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .folder-head .cnt { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 400; }
  .folder-head .mini { border: none; background: none; color: var(--faint); cursor: pointer; font-size: 14px; padding: 0 2px; }
  .folder-chats { margin: 0 0 4px 18px; border-left: 2px solid var(--border); padding-left: 6px; }
  .folder.collapsed .folder-chats { display: none; }
  .folder.collapsed .caret { transform: rotate(-90deg); }
  .chatrow { display: flex; align-items: center; gap: 6px; padding: 9px 10px; border-radius: 10px;
    cursor: pointer; font-size: 13.5px; }
  .chatrow:hover { background: var(--accent-soft); }
  .chatrow.active { background: var(--accent-soft); box-shadow: inset 2.5px 0 0 var(--accent); }
  .chatrow .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chatrow .m { font-size: 10px; color: var(--muted); white-space: nowrap; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
  .chatrow .dots { border: none; background: none; color: var(--faint); font-size: 16px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .side-foot { border-top: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .statusdot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); flex: none; }
  .statusdot.ok { background: #2f9e6e; } .statusdot.bad { background: #d64545; } .statusdot.work { background: #d9a441; }
  .side-foot .st { font-size: 12px; color: var(--muted); flex: 1; }
  .scrim { display: none; }

  /* ---------- main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .burger { display: none; }
  .modelbtn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--card);
    color: var(--text); border-radius: 12px; padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; max-width: 60vw; }
  .modelbtn .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .modelbtn .chev { color: var(--muted); font-size: 12px; }
  .modelbtn:active { transform: scale(.98); }
  .topspacer { flex: 1; }
  .chattitle { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }

  #chat { flex: 1; overflow-y: auto; padding: 22px 18px; }
  .col { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .empty { text-align: center; padding: 8vh 16px 0; }
  .empty .mark { width: 58px; height: 58px; border-radius: 18px; margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--accent), #e8a04c); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; }
  .empty h2 { font-size: 22px; margin: 0 0 8px; font-weight: 700; }
  .empty p { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .sugs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .sug { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 999px;
    padding: 9px 16px; font-size: 13px; cursor: pointer; }
  .sug:active { transform: scale(.97); }

  .msg { display: flex; gap: 12px; animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .avatar { width: 32px; height: 32px; border-radius: 10px; flex: none; display: flex; align-items: center;
    justify-content: center; font-size: 15px; font-weight: 800; }
  .avatar.ai { background: linear-gradient(135deg, var(--accent), #e8a04c); color: #fff; }
  .avatar.you { background: var(--border); color: var(--muted); }
  .bubble { flex: 1; min-width: 0; background: var(--bubble-ai); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 16px; font-size: 14.5px; line-height: 1.65; overflow-wrap: break-word; }
  .msg.user .bubble { background: var(--bubble-user); }
  .msg.err .bubble { border-color: #d64545; background: rgba(214,69,69,.07); }
  .bubble p { margin: 0 0 10px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble h1, .bubble h2, .bubble h3 { margin: 12px 0 6px; font-size: 15px; }
  .bubble ul, .bubble ol { margin: 6px 0 10px; padding-left: 22px; }
  .bubble li { margin-bottom: 4px; }
  .bubble code.ic { background: var(--accent-soft); border-radius: 6px; padding: 1px 6px; font-size: 13px;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  .codeblock { margin: 10px 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .codeblock .chead { display: flex; align-items: center; justify-content: space-between;
    background: var(--sidebar); padding: 6px 12px; font-size: 11px; color: var(--muted); }
  .codeblock .chead button { border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 7px; font-size: 11px; padding: 3px 10px; cursor: pointer; }
  .codeblock pre { margin: 0; padding: 12px; overflow-x: auto; font-size: 12.5px; line-height: 1.55;
    font-family: ui-monospace, Menlo, Consolas, monospace; background: rgba(0,0,0,.25); }
  [data-theme="light"] .codeblock pre { background: #2b2620; color: #ece6d8; }
  .bubble a { color: var(--accent); }
  .msgactions { display: flex; gap: 6px; margin-top: 8px; }
  .msgactions button { border: 1px solid var(--border); background: none; color: var(--muted);
    border-radius: 8px; font-size: 11.5px; padding: 4px 11px; cursor: pointer; }
  .msgactions button:active { transform: scale(.96); }
  .msgmeta { font-size: 11px; color: var(--faint); margin-top: 8px; }
  .typing { display: inline-flex; gap: 5px; padding: 6px 0; }
  .typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .composer { border-top: 1px solid var(--border); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .cbox { max-width: 780px; margin: 0 auto; background: var(--input); border: 1px solid var(--border);
    border-radius: 18px; padding: 8px 8px 8px 16px; display: flex; align-items: flex-end; gap: 8px;
    box-shadow: var(--shadow); }
  .cbox:focus-within { border-color: var(--accent); }
  #input { flex: 1; border: none; background: none; color: var(--text); resize: none; font-size: 15px;
    font-family: inherit; max-height: 150px; padding: 10px 0; line-height: 1.5; }
  #input:focus { outline: none; }
  #send { width: 44px; height: 44px; flex: none; border-radius: 14px; border: none; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 18px; }
  #send:disabled { opacity: .4; }
  #send.stop { background: #d64545; }
  .chint { max-width: 780px; margin: 6px auto 0; font-size: 11px; color: var(--faint); text-align: center; }

  /* ---------- modals ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(20,16,10,.5); display: none;
    align-items: flex-start; justify-content: center; z-index: 100; padding: 8vh 16px 16px; }
  .overlay.open { display: flex; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 18px; width: 100%;
    max-width: 520px; max-height: 76dvh; display: flex; flex-direction: column; box-shadow: var(--shadow);
    animation: pop .16s ease-out; }
  .phead { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 10px; }
  .phead h3 { margin: 0; font-size: 16px; }
  .phead .x { border: none; background: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  .pbody { padding: 4px 18px 18px; overflow-y: auto; }
  .pbody label { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); display: block; margin: 14px 0 6px; }
  .pbody label:first-child { margin-top: 4px; }
  .pbody input[type=text], .pbody input[type=number], .pbody select {
    width: 100%; border: 1px solid var(--border); background: var(--input); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .pbody input[type=range] { width: 100%; accent-color: var(--accent); }
  .rangeval { font-size: 12px; color: var(--muted); }
  .prow { display: flex; gap: 8px; margin-top: 16px; }
  .btn { flex: 1; border: none; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 700;
    background: var(--accent); color: #fff; cursor: pointer; }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: none; border: 1px solid var(--border); color: var(--text); }
  .btn.danger { background: #d64545; }
  .switchrow { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 14px; }
  .switchrow input { width: 20px; height: 20px; accent-color: var(--accent); }

  .msearch { padding: 0 18px 8px; }
  .msearch input { width: 100%; border: 1px solid var(--border); background: var(--input); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .mlist { overflow-y: auto; padding: 0 10px 14px; }
  .mgroup { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); padding: 12px 8px 4px; }
  .mitem { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: none;
    background: none; color: var(--text); padding: 11px 10px; border-radius: 10px; font-size: 14px; cursor: pointer; }
  .mitem:hover { background: var(--accent-soft); }
  .mitem.sel { background: var(--accent-soft); }
  .mitem .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mitem .tick { color: var(--accent); font-weight: 800; width: 20px; }

  .menu { position: fixed; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); z-index: 200; min-width: 190px; padding: 6px; display: none; }
  .menu.open { display: block; }
  .menu button { display: flex; width: 100%; text-align: left; border: none; background: none; color: var(--text);
    font-size: 13.5px; padding: 10px 12px; border-radius: 8px; cursor: pointer; align-items: center; gap: 8px; }
  .menu button:hover { background: var(--accent-soft); }
  .menu button.danger { color: #d64545; }
  .menu .sep { height: 1px; background: var(--border); margin: 5px 8px; }
  .menu .mhead { font-size: 11px; color: var(--muted); padding: 6px 12px 2px; text-transform: uppercase; letter-spacing: .6px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text);
    color: var(--bg); font-size: 13px; padding: 10px 18px; border-radius: 999px; opacity: 0;
    transition: all .25s; z-index: 300; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 820px) {
    .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-105%);
      transition: transform .25s ease; box-shadow: var(--shadow); }
    .sidebar.open { transform: translateX(0); }
    .scrim { position: fixed; inset: 0; background: rgba(20,16,10,.45); z-index: 30; display: block;
      opacity: 0; pointer-events: none; transition: opacity .25s; }
    .scrim.on { opacity: 1; pointer-events: auto; }
    .burger { display: block; }
    .chattitle { display: none; }
    .modelbtn { max-width: 52vw; }
    .overlay { padding: 5vh 12px 12px; align-items: flex-end; }
    .panel { max-width: 100%; max-height: 88dvh; border-radius: 20px 20px 0 0; }
    .overlay.centerfx { align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <button class="newchat" id="newchatbtn"><span style="font-size:17px">+</span> New chat</button>
      <button class="iconbtn" id="closeside" title="Close" style="display:none">&#10005;</button>
    </div>
    <div class="searchrow"><input id="chatsearch" placeholder="Search chats..."></div>
    <div class="side-scroll" id="sidescroll"></div>
    <div class="side-foot">
      <span class="statusdot work" id="statusdot"></span>
      <span class="st" id="statustext">connecting...</span>
      <button class="iconbtn" id="themebtn" title="Theme" style="width:36px;height:36px">&#9790;</button>
      <button class="iconbtn" id="settingsbtn" title="Settings" style="width:36px;height:36px">&#9881;</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="iconbtn burger" id="burger" style="width:40px;height:40px">&#9776;</button>
      <button class="modelbtn" id="modelbtn"><span class="nm" id="modelname">select model</span><span class="chev">&#9662;</span></button>
      <div class="topspacer"></div>
      <div class="chattitle" id="chattitle"></div>
    </div>
    <div id="chat"><div class="col" id="col"></div></div>
    <div class="composer">
      <div class="cbox">
        <textarea id="input" rows="1" placeholder="Message Kilo AI..."></textarea>
        <button id="send" title="Send">&#10148;</button>
      </div>
      <div class="chint">Kilo AI can make mistakes. Check important info.</div>
    </div>
  </div>
</div>

<!-- model picker -->
<div class="overlay centerfx" id="modelov">
  <div class="panel">
    <div class="phead"><h3>Choose a model</h3><button class="x" data-close="modelov">&#10005;</button></div>
    <div class="msearch"><input id="msearch" placeholder="Search models..."></div>
    <div class="mlist" id="mlist"></div>
  </div>
</div>

<!-- settings -->
<div class="overlay" id="setov">
  <div class="panel">
    <div class="phead"><h3>Settings</h3><button class="x" data-close="setov">&#10005;</button></div>
    <div class="pbody">
      <label>API base URL</label>
      <input type="text" id="s_base" placeholder="https://xxx.loca.lt">
      <label>API key</label>
      <input type="text" id="s_key" placeholder="any value works">
      <label>System prompt</label>
      <input type="text" id="s_sys" placeholder="e.g. You are a helpful assistant.">
      <label>Temperature <span class="rangeval" id="tempval"></span></label>
      <input type="range" id="s_temp" min="0" max="2" step="0.1">
      <label>Max tokens <span class="rangeval" id="tokval"></span></label>
      <input type="range" id="s_tok" min="256" max="8192" step="256">
      <div class="prow">
        <button class="btn" id="s_save">Save &amp; reconnect</button>
      </div>
      <div class="prow">
        <button class="btn ghost" id="exportall">Export all chats</button>
        <button class="btn ghost danger" id="wipedata" style="color:#d64545">Erase all data</button>
      </div>
    </div>
  </div>
</div>

<!-- prompt modal (rename / new folder) -->
<div class="overlay centerfx" id="promptov">
  <div class="panel" style="max-width:380px">
    <div class="phead"><h3 id="prompttitle">Rename</h3><button class="x" data-close="promptov">&#10005;</button></div>
    <div class="pbody">
      <input type="text" id="promptinput" style="margin-top:4px">
      <div class="prow"><button class="btn" id="promptok">Save</button></div>
    </div>
  </div>
</div>

<div class="menu" id="menu"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= storage ================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ================= state ================= */
const DEF_SETTINGS = { base: 'https://kilo-api-alhussainacademy.loca.lt', key: 'playground', sys: '', temp: 0.7, maxTokens: 2048, model: '' };
let settings = Object.assign({}, DEF_SETTINGS, store.get('kilo_v3_settings', {}));
let chats = store.get('kilo_v3_chats', []);
let folders = store.get('kilo_v3_folders', []);
let modelsCache = store.get('kilo_v3_models', { list: [], ts: 0 });
let activeChatId = store.get('kilo_v3_active', null);
let collapsedFolders = store.get('kilo_v3_collapsed', {});
let generating = false, abortCtl = null;

const $ = id => document.getElementById(id);
const col = $('col'), input = $('input'), sendBtn = $('send');
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function saveAll() {
  store.set('kilo_v3_settings', settings);
  store.set('kilo_v3_chats', chats);
  store.set('kilo_v3_folders', folders);
  store.set('kilo_v3_active', activeChatId);
  store.set('kilo_v3_collapsed', collapsedFolders);
}

/* ================= theme ================= */
function applyTheme() {
  document.documentElement.dataset.theme = store.get('kilo_v3_theme', 'light');
  $('themebtn').innerHTML = document.documentElement.dataset.theme === 'light' ? '&#9790;' : '&#9788;';
}
$('themebtn').onclick = () => {
  store.set('kilo_v3_theme', document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  applyTheme();
};

/* ================= api ================= */
const base = () => (settings.base || '').replace(/\/+$/, '');
/* bypass-tunnel-reminder: documented localtunnel bypass so browsers skip
   the "Tunnel website ahead!" interstitial (which otherwise returns HTTP 511). */
const fullHeaders = () => ({
  'Content-Type': 'application/json',
  'Authorization': 'Bearer ' + (settings.key || 'x'),
  'bypass-tunnel-reminder': '1'
});
const plainHeaders = () => ({
  'Content-Type': 'application/json',
  'Authorization': 'Bearer ' + (settings.key || 'x')
});
async function apiFetch(url, opts) {
  opts = opts || {};
  try {
    return await fetch(url, Object.assign({}, opts, { headers: fullHeaders(), signal: opts.signal }));
  } catch (e) {
    /* preflight may reject the custom bypass header; retry without it */
    if (opts.signal && opts.signal.aborted) throw e;
    return await fetch(url, Object.assign({}, opts, { headers: plainHeaders(), signal: opts.signal }));
  }
}
function explainError(status, detail) {
  if (status === 511) return 'The tunnel showed its "Tunnel website ahead!" security page instead of the API. This usually clears on retry; if it keeps happening the tunnel host may need to restart it.';
  if (status === 502 || status === 503) return 'The tunnel is temporarily down or restarting (HTTP ' + status + '). Wait a few seconds and try again.';
  if (status === 0) return 'Could not reach the API at all. Check the base URL in Settings and your internet connection.';
  return 'Request failed (HTTP ' + status + ').' + (detail ? ' ' + detail : '');
}
function setStatus(state, text) {
  $('statusdot').className = 'statusdot ' + state;
  $('statustext').textContent = text;
}

/* ================= markdown ================= */
function md(src) {
  const blocks = [];
  src = src.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push({ lang: lang || 'code', code: code.replace(/\n$/, '') });
    return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  let h = esc(src);
  h = h.replace(/^### (.*)$/gm, '<h3>$1</h3>').replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/^# (.*)$/gm, '<h1>$1</h1>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  h = h.replace(/`([^`\n]+)`/g, '<code class="ic">$1</code>');
  h = h.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = h.split('\n'), out = [];
  let inList = null;
  for (const ln of lines) {
    const ul = ln.match(/^\s*[-*] (.*)/), ol = ln.match(/^\s*\d+\. (.*)/);
    const tag = ul ? 'ul' : (ol ? 'ol' : null);
    if (tag) {
      if (inList !== tag) { if (inList) out.push('</' + inList + '>'); out.push('<' + tag + '>'); inList = tag; }
      out.push('<li>' + (ul ? ul[1] : ol[1]) + '</li>');
    } else {
      if (inList) { out.push('</' + inList + '>'); inList = null; }
      if (ln.includes('\u0000')) out.push(ln); else if (ln.trim()) out.push('<p>' + ln + '</p>');
    }
  }
  if (inList) out.push('</' + inList + '>');
  h = out.join('\n');
  h = h.replace(/\u0000(\d+)\u0000/g, (m, i) => {
    const b = blocks[+i];
    const id = 'cb' + Math.random().toString(36).slice(2, 8);
    return '<div class="codeblock"><div class="chead"><span>' + esc(b.lang) + '</span>' +
      '<button data-copycode="' + id + '">copy</button></div>' +
      '<pre><code id="' + id + '">' + esc(b.code) + '</code></pre></div>';
  });
  return h;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copycode]');
  if (!b) return;
  const code = document.getElementById(b.dataset.copycode);
  if (!code) return;
  const done = ok => { b.textContent = ok ? 'copied' : 'failed'; setTimeout(() => b.textContent = 'copy', 1200); };
  if (navigator.clipboard) navigator.clipboard.writeText(code.textContent).then(() => done(true), () => done(false));
  else done(false);
});

/* ================= models ================= */
function providerOf(id) {
  const p = id.split(/[/:]/)[0];
  return p === id ? 'other' : p;
}
function renderModelList(filter) {
  const list = $('mlist'); list.innerHTML = '';
  const f = (filter || '').toLowerCase();
  const items = modelsCache.list.filter(id => id.toLowerCase().includes(f));
  if (!items.length) { list.innerHTML = '<div style="padding:20px;color:var(--muted);font-size:13px">No models found.</div>'; return; }
  const groups = {};
  items.forEach(id => { const g = providerOf(id); (groups[g] = groups[g] || []).push(id); });
  Object.keys(groups).sort().forEach(g => {
    const gh = document.createElement('div'); gh.className = 'mgroup'; gh.textContent = g; list.appendChild(gh);
    groups[g].sort().forEach(id => {
      const b = document.createElement('button'); b.className = 'mitem' + (id === settings.model ? ' sel' : '');
      b.innerHTML = '<span class="tick">' + (id === settings.model ? '&#10003;' : '') + '</span><span class="nm"></span>';
      b.querySelector('.nm').textContent = id;
      b.onclick = () => { setModel(id); closeOv('modelov'); };
      list.appendChild(b);
    });
  });
}
function setModel(id) {
  settings.model = id;
  $('modelname').textContent = id || 'select model';
  saveAll(); renderModelList($('msearch').value);
  const c = activeChat(); if (c && !c.messages.length) c.model = id;
}
async function loadModels(silent) {
  if (!silent) setStatus('work', 'connecting...');
  try {
    const r = await apiFetch(base() + '/v1/models');
    if (r.status === 511) throw { status: 511 };
    if (!r.ok) throw { status: r.status };
    const j = await r.json();
    const ids = (j.data || []).map(m => m.id).sort();
    if (!ids.length) throw { status: -1, detail: 'empty model list' };
    modelsCache = { list: ids, ts: Date.now() };
    store.set('kilo_v3_models', modelsCache);
    if (!ids.includes(settings.model)) {
      const pref = ['deepseek-v3', 'deepseek-3-2', 'gpt-5-3-codex'];
      settings.model = pref.find(p => ids.includes(p)) || ids[0];
    }
    $('modelname').textContent = settings.model;
    setStatus('ok', ids.length + ' models online');
    renderModelList($('msearch').value);
    saveAll();
  } catch (e) {
    const st = (e && e.status) || 0;
    setStatus('bad', 'offline');
    if (!silent) toast(explainError(st, e.detail));
  }
}

/* ================= chats & folders ================= */
const activeChat = () => chats.find(c => c.id === activeChatId) || null;
function chatTitle(c) {
  if (c.title) return c.title;
  const f = c.messages.find(m => m.role === 'user');
  return f ? f.content.slice(0, 42) : 'New chat';
}
function renderSidebar() {
  const sc = $('sidescroll'); sc.innerHTML = '';
  const q = ($('chatsearch').value || '').toLowerCase();
  const match = c => !q || chatTitle(c).toLowerCase().includes(q) ||
    c.messages.some(m => m.content.toLowerCase().includes(q));

  const fh = document.createElement('div'); fh.className = 'sechead';
  fh.innerHTML = '<span>Folders</span>';
  const addF = document.createElement('button'); addF.textContent = '+'; addF.title = 'New folder';
  addF.onclick = () => promptModal('New folder', '', name => {
    if (!name.trim()) return;
    const colors = ['#c15f3c', '#4f7cff', '#2f9e6e', '#a855f7', '#d9a441', '#0ea5e9'];
    folders.push({ id: uid(), name: name.trim().slice(0, 40), color: colors[folders.length % colors.length] });
    saveAll(); renderSidebar(); toast('Folder created');
  });
  fh.appendChild(addF); sc.appendChild(fh);

  folders.forEach(f => {
    const fchats = chats.filter(c => c.folderId === f.id && match(c));
    const wrap = document.createElement('div');
    wrap.className = 'folder' + (collapsedFolders[f.id] ? ' collapsed' : '');
    const head = document.createElement('div'); head.className = 'folder-head';
    head.innerHTML = '<span class="caret">&#9662;</span><span class="dot" style="background:' + f.color + '"></span>';
    const nm = document.createElement('span'); nm.textContent = f.name; head.appendChild(nm);
    const cnt = document.createElement('span'); cnt.className = 'cnt'; cnt.textContent = fchats.length; head.appendChild(cnt);
    const menu = document.createElement('button'); menu.className = 'mini'; menu.textContent = '\u22ef';
    menu.onclick = ev => { ev.stopPropagation(); folderMenu(f, menu); };
    head.appendChild(menu);
    head.onclick = () => { collapsedFolders[f.id] = !collapsedFolders[f.id]; saveAll(); renderSidebar(); };
    wrap.appendChild(head);
    const box = document.createElement('div'); box.className = 'folder-chats';
    fchats.forEach(c => box.appendChild(chatRow(c)));
    wrap.appendChild(box);
    sc.appendChild(wrap);
  });

  const ch = document.createElement('div'); ch.className = 'sechead';
  ch.innerHTML = '<span>Chats</span>'; sc.appendChild(ch);
  const ungrouped = chats.filter(c => !c.folderId && match(c))
    .sort((a, b) => b.updatedAt - a.updatedAt);
  if (!ungrouped.length && !folders.length) {
    const d = document.createElement('div');
    d.style.cssText = 'padding:10px;color:var(--muted);font-size:13px';
    d.textContent = 'No chats yet. Start a new one.';
    sc.appendChild(d);
  }
  ungrouped.forEach(c => sc.appendChild(chatRow(c)));
}
function chatRow(c) {
  const r = document.createElement('div');
  r.className = 'chatrow' + (c.id === activeChatId ? ' active' : '');
  const t = document.createElement('span'); t.className = 't'; t.textContent = chatTitle(c);
  const m = document.createElement('span'); m.className = 'm'; m.textContent = (c.model || '').split(/[/:]/).pop();
  const d = document.createElement('button'); d.className = 'dots'; d.textContent = '\u22ef';
  d.onclick = ev => { ev.stopPropagation(); chatMenu(c, d); };
  r.append(t, m, d);
  r.onclick = () => openChat(c.id);
  return r;
}
function openChat(id) {
  activeChatId = id; saveAll();
  renderSidebar(); renderMessages();
  $('chattitle').textContent = chatTitle(activeChat());
  if (window.innerWidth <= 820) closeSidebar();
  const c = activeChat();
  if (c && c.model && modelsCache.list.includes(c.model)) setModelQuiet(c.model);
}
function setModelQuiet(id) { settings.model = id; $('modelname').textContent = id; saveAll(); }
function newChat() {
  const c = { id: uid(), title: '', folderId: null, model: settings.model,
    createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
  chats.unshift(c); activeChatId = c.id; saveAll();
  renderSidebar(); renderMessages(); $('chattitle').textContent = 'New chat';
  if (window.innerWidth <= 820) closeSidebar();
  input.focus();
}
function deleteChat(id) {
  chats = chats.filter(c => c.id !== id);
  if (activeChatId === id) activeChatId = chats.length ? chats[0].id : null;
  saveAll(); renderSidebar(); renderMessages();
  const c = activeChat(); $('chattitle').textContent = c ? chatTitle(c) : '';
}
function exportChat(c) {
  let out = '# ' + chatTitle(c) + '\n_model: ' + (c.model || 'unknown') + ' | ' +
    new Date(c.createdAt).toLocaleString() + '_\n\n';
  c.messages.forEach(m => {
    out += m.role === 'user' ? '## You\n' : '## Kilo AI\n';
    out += m.content + '\n\n';
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], { type: 'text/markdown' }));
  a.download = chatTitle(c).replace(/[^\w\- ]+/g, '').slice(0, 40) + '.md';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Chat exported');
}

/* ================= messages ================= */
function scrollBottom() { const ch = $('chat'); ch.scrollTop = ch.scrollHeight; }
function renderMessages() {
  col.innerHTML = '';
  const c = activeChat();
  if (!c || !c.messages.length) { renderEmpty(); return; }
  c.messages.forEach((m, i) => col.appendChild(msgEl(m, i)));
  scrollBottom();
}
function renderEmpty() {
  const d = document.createElement('div'); d.className = 'empty';
  d.innerHTML = '<div class="mark">K</div><h2>How can I help?</h2>' +
    '<p>Pick a model above, then start chatting. Your chats and folders stay on this device.</p>';
  const sugs = document.createElement('div'); sugs.className = 'sugs';
  ['Explain a tricky concept simply', 'Write a short professional email', 'Give me 5 business ideas', 'Help me debug code'].forEach(s => {
    const b = document.createElement('button'); b.className = 'sug'; b.textContent = s;
    b.onclick = () => { input.value = s; input.focus(); autosize(); };
    sugs.appendChild(b);
  });
  d.appendChild(sugs); col.appendChild(d);
}
function msgEl(m, idx) {
  const c = activeChat();
  const w = document.createElement('div');
  w.className = 'msg ' + (m.role === 'user' ? 'user' : 'bot') + (m.error ? ' err' : '');
  const av = document.createElement('div');
  av.className = 'avatar ' + (m.role === 'user' ? 'you' : 'ai');
  av.textContent = m.role === 'user' ? '\u263a' : 'K';
  const b = document.createElement('div'); b.className = 'bubble';
  b.innerHTML = m.role === 'user' ? esc(m.content).replace(/\n/g, '<br>') : md(m.content);
  w.appendChild(av); w.appendChild(b);
  if (m.role === 'assistant' && !m.error) {
    const acts = document.createElement('div'); acts.className = 'msgactions';
    const cp = document.createElement('button'); cp.textContent = 'copy';
    cp.onclick = () => {
      const done = ok => { cp.textContent = ok ? 'copied' : 'failed'; setTimeout(() => cp.textContent = 'copy', 1200); };
      if (navigator.clipboard) navigator.clipboard.writeText(m.content).then(() => done(true), () => done(false));
      else done(false);
    };
    acts.appendChild(cp);
    if (idx === c.messages.length - 1) {
      const rg = document.createElement('button'); rg.textContent = 'regenerate';
      rg.onclick = () => regenerate();
      acts.appendChild(rg);
    }
    b.appendChild(acts);
    if (m.secs || m.tokens) {
      const meta = document.createElement('div'); meta.className = 'msgmeta';
      meta.textContent = (m.secs ? m.secs + 's' : '') + (m.secs && m.tokens ? ' | ' : '') + (m.tokens ? m.tokens + ' tokens' : '');
      b.appendChild(meta);
    }
  }
  return w;
}
function typingEl(modelName) {
  const w = document.createElement('div'); w.className = 'msg bot'; w.id = 'typingrow';
  w.innerHTML = '<div class="avatar ai">K</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
  col.appendChild(w); scrollBottom();
  return w;
}

async function sendMessage(text) {
  text = (text || '').trim();
  if (!text || generating) return;
  let c = activeChat();
  if (!c) { newChat(); c = activeChat(); }
  if (!settings.model) { toast('Pick a model first'); openOv('modelov'); return; }
  c.model = settings.model;
  const msgs = [];
  if (settings.sys.trim()) msgs.push({ role: 'system', content: settings.sys.trim() });
  c.messages.push({ role: 'user', content: text, ts: Date.now() });
  msgs.push(...c.messages.map(m => ({ role: m.role, content: m.content })));
  c.updatedAt = Date.now(); saveAll();
  renderMessages();
  input.value = ''; autosize();
  generating = true; abortCtl = new AbortController();
  sendBtn.innerHTML = '&#9632;'; sendBtn.classList.add('stop'); sendBtn.disabled = false;
  sendBtn.title = 'Stop';
  typingEl();
  const t0 = Date.now();
  try {
    const r = await apiFetch(base() + '/v1/chat/completions', {
      method: 'POST', signal: abortCtl.signal,
      body: JSON.stringify({ model: settings.model, messages: msgs, temperature: settings.temp, max_tokens: settings.maxTokens })
    });
    if (r.status === 511) throw { status: 511 };
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { status: r.status, detail: j.error ? JSON.stringify(j.error).slice(0, 200) : '' };
    const reply = (((j.choices || [])[0] || {}).message || {}).content || '(empty reply)';
    c.messages.push({ role: 'assistant', content: reply, ts: Date.now(),
      secs: ((Date.now() - t0) / 1000).toFixed(1),
      tokens: j.usage && j.usage.total_tokens ? j.usage.total_tokens : null });
  } catch (e) {
    if (e.name === 'AbortError') {
      c.messages.push({ role: 'assistant', content: 'Stopped by you.', error: true, ts: Date.now() });
    } else {
      const st = (e && e.status) || 0;
      c.messages.push({ role: 'assistant', content: explainError(st, e.detail), error: true, ts: Date.now() });
    }
  }
  generating = false; abortCtl = null;
  sendBtn.innerHTML = '&#10148;'; sendBtn.classList.remove('stop'); sendBtn.title = 'Send';
  const tp = $('typingrow'); if (tp) tp.remove();
  c.updatedAt = Date.now(); saveAll();
  renderSidebar(); renderMessages();
  $('chattitle').textContent = chatTitle(c);
}
async function regenerate() {
  const c = activeChat();
  if (!c || generating) return;
  const last = c.messages[c.messages.length - 1];
  if (!last || last.role !== 'assistant' || last.error) return;
  c.messages.pop();
  const prev = c.messages[c.messages.length - 1];
  const text = prev && prev.role === 'user' ? prev.content : '';
  if (prev && prev.role === 'user') c.messages.pop();
  saveAll(); renderMessages();
  if (text) await sendMessage(text);
}
function stopGen() { if (abortCtl) abortCtl.abort(); }

/* ================= menus ================= */
const menu = $('menu');
function closeMenu() { menu.classList.remove('open'); }
function openMenu(anchor, html) {
  menu.innerHTML = html; menu.classList.add('open');
  const r = anchor.getBoundingClientRect();
  menu.style.visibility = 'hidden'; menu.classList.add('open');
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let x = Math.min(r.left, window.innerWidth - mw - 10);
  let y = r.bottom + 6;
  if (y + mh > window.innerHeight - 10) y = r.top - mh - 6;
  menu.style.left = Math.max(10, x) + 'px'; menu.style.top = Math.max(10, y) + 'px';
  menu.style.visibility = '';
}
document.addEventListener('click', e => { if (!e.target.closest('#menu')) closeMenu(); });
function chatMenu(c, anchor) {
  let h = '<button data-a="rename">Rename</button>';
  h += '<div class="sep"></div><div class="mhead">Move to folder</div>';
  h += '<button data-a="ungroup">No folder</button>';
  folders.forEach(f => { h += '<button data-a="mv:' + f.id + '">' + esc(f.name) + '</button>'; });
  h += '<div class="sep"></div><button data-a="export">Export as markdown</button>' +
       '<button data-a="del" class="danger">Delete chat</button>';
  openMenu(anchor, h);
  menu.querySelectorAll('button').forEach(b => b.onclick = () => {
    closeMenu();
    const a = b.dataset.a;
    if (a === 'rename') promptModal('Rename chat', chatTitle(c), v => {
      if (v.trim()) { c.title = v.trim().slice(0, 60); c.updatedAt = Date.now(); saveAll(); renderSidebar();
        if (c.id === activeChatId) $('chattitle').textContent = c.title; }
    });
    else if (a === 'ungroup') { c.folderId = null; saveAll(); renderSidebar(); }
    else if (a.startsWith('mv:')) { c.folderId = a.slice(3); saveAll(); renderSidebar(); toast('Moved to folder'); }
    else if (a === 'export') exportChat(c);
    else if (a === 'del' && confirm('Delete this chat?')) deleteChat(c.id);
  });
}
function folderMenu(f, anchor) {
  openMenu(anchor, '<button data-a="rename">Rename folder</button><button data-a="del" class="danger">Delete folder</button>');
  menu.querySelectorAll('button').forEach(b => b.onclick = () => {
    closeMenu();
    if (b.dataset.a === 'rename') promptModal('Rename folder', f.name, v => {
      if (v.trim()) { f.name = v.trim().slice(0, 40); saveAll(); renderSidebar(); }
    });
    else if (confirm('Delete folder "' + f.name + '"? Its chats move back to the main list.')) {
      chats.forEach(c => { if (c.folderId === f.id) c.folderId = null; });
      folders = folders.filter(x => x.id !== f.id);
      saveAll(); renderSidebar();
    }
  });
}

/* ================= prompt modal ================= */
let promptCb = null;
function promptModal(title, value, cb) {
  $('prompttitle').textContent = title;
  $('promptinput').value = value || '';
  promptCb = cb; openOv('promptov');
  setTimeout(() => { $('promptinput').focus(); $('promptinput').select(); }, 60);
}
$('promptok').onclick = () => { closeOv('promptov'); if (promptCb) promptCb($('promptinput').value); };
$('promptinput').addEventListener('keydown', e => { if (e.key === 'Enter') $('promptok').click(); });

/* ================= overlays ================= */
function openOv(id) { $(id).classList.add('open'); }
function closeOv(id) { $(id).classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closeOv(b.dataset.close));
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) closeOv(o.id); }));

/* ================= wiring ================= */
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 150) + 'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 820) { e.preventDefault(); sendMessage(input.value); }
});
sendBtn.onclick = () => { if (generating) stopGen(); else sendMessage(input.value); };
$('newchatbtn').onclick = newChat;
$('burger').onclick = () => { $('sidebar').classList.add('open'); $('scrim').classList.add('on'); $('closeside').style.display = ''; };
function closeSidebar() { $('sidebar').classList.remove('open'); $('scrim').classList.remove('on'); }
$('scrim').onclick = closeSidebar;
$('closeside').onclick = closeSidebar;
$('chatsearch').addEventListener('input', renderSidebar);
$('modelbtn').onclick = () => { $('msearch').value = ''; renderModelList(''); openOv('modelov'); setTimeout(() => $('msearch').focus(), 60); };
$('msearch').addEventListener('input', e => renderModelList(e.target.value));
$('settingsbtn').onclick = () => {
  $('s_base').value = settings.base; $('s_key').value = settings.key; $('s_sys').value = settings.sys;
  $('s_temp').value = settings.temp; $('s_tok').value = settings.maxTokens;
  $('tempval').textContent = settings.temp; $('tokval').textContent = settings.maxTokens;
  openOv('setov');
};
$('s_temp').addEventListener('input', e => $('tempval').textContent = e.target.value);
$('s_tok').addEventListener('input', e => $('tokval').textContent = e.target.value);
$('s_save').onclick = () => {
  settings.base = $('s_base').value.trim(); settings.key = $('s_key').value.trim();
  settings.sys = $('s_sys').value; settings.temp = parseFloat($('s_temp').value);
  settings.maxTokens = parseInt($('s_tok').value, 10);
  saveAll(); closeOv('setov'); toast('Settings saved');
  loadModels();
};
$('exportall').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ chats, folders }, null, 2)], { type: 'application/json' }));
  a.download = 'kilo-chats-backup.json'; a.click(); URL.revokeObjectURL(a.href);
  toast('Backup downloaded');
};
$('wipedata').onclick = () => {
  if (!confirm('Erase ALL chats, folders and settings on this device?')) return;
  ['kilo_v3_settings','kilo_v3_chats','kilo_v3_folders','kilo_v3_models','kilo_v3_active','kilo_v3_collapsed'].forEach(k => store.del(k));
  location.reload();
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); ['modelov','setov','promptov'].forEach(closeOv); } });

/* ================= init ================= */
applyTheme();
if (window.innerWidth <= 820) $('closeside').style.display = '';
$('modelname').textContent = settings.model || 'select model';
if (!activeChatId || !activeChat()) activeChatId = chats.length ? chats[0].id : null;
renderSidebar();
const ac = activeChat();
if (ac) { renderMessages(); $('chattitle').textContent = chatTitle(ac); }
else renderEmpty();
loadModels();
setInterval(() => loadModels(true), 5 * 60 * 1000);
</script>
